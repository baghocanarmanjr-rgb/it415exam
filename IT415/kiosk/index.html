<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campus Store Kiosk</title>
  <style>
    :root {
      --bg: #edf0f5;
      --card: #fff;
      --ink: #111827;
      --mute: #5b6473;
      --nav: #101828;
      --acc: #c2410c;
      --line: #dfe3ea;
      --ok: #15803d;
      --err: #b91c1c;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1220;
        --card: #162033;
        --ink: #f1f5f9;
        --mute: #9aa6b8;
        --line: #2a3750;
        --acc: #ea580c
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b1220;
      --card: #162033;
      --ink: #f1f5f9;
      --mute: #9aa6b8;
      --line: #2a3750;
      --acc: #ea580c
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 18px/1.35 "Segoe UI", system-ui, sans-serif;
      min-height: 100vh
    }

    header {
      background: var(--nav);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      gap: 12px;
      flex-wrap: wrap
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 700
    }

    .logo {
      background: var(--acc);
      border-radius: 10px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center
    }

    .steps {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .steps span {
      padding: 8px 14px;
      border-radius: 99px;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 600
    }

    .steps .on {
      background: #fff;
      color: var(--nav)
    }

    .steps .done {
      background: #1e293b;
      color: #e2e8f0
    }

    main {
      padding: 20px;
      max-width: 1200px;
      margin: auto
    }

    h1 {
      font-size: 30px;
      margin: 0 0 6px
    }

    p.sub {
      color: var(--mute);
      margin: 0 0 16px
    }

    button {
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border-radius: 14px;
      border: 2px solid var(--ink);
      background: var(--card);
      color: var(--ink);
      min-height: 56px;
      padding: 12px 20px;
      touch-action: manipulation
    }

    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px
    }

    button.p {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      font-size: 20px
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px
    }

    @media(max-width:860px) {
      .layout {
        grid-template-columns: 1fr
      }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px
    }

    .item {
      position: relative;
      text-align: left;
      padding: 12px;
      border: 2px solid var(--line);
      min-height: 190px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .item.sel {
      border-color: var(--acc)
    }

    .ico {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 54px;
      min-height: 130px
    }

    .ico img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .item b {
      display: flex;
      justify-content: space-between;
      gap: 6px
    }

    .item b em {
      color: var(--acc);
      font-style: normal
    }

    .badge {
      position: absolute;
      top: 18px;
      right: 18px;
      background: var(--acc);
      color: #fff;
      border-radius: 99px;
      min-width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      font-size: 15px
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px
    }

    .line {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .q {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px
    }

    .q button {
      min-height: 48px;
      min-width: 48px;
      padding: 0;
      font-size: 24px
    }

    .del {
      border-color: #fca5a5;
      color: var(--err);
      min-height: 44px;
      min-width: 44px;
      padding: 0
    }

    .total {
      font-size: 34px;
      font-weight: 800
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      padding: 12px 8px;
      text-align: right;
      border-bottom: 1px solid var(--line)
    }

    th:first-child,
    td:first-child {
      text-align: left
    }

    .pay {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px
    }

    .pay button {
      min-height: 210px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: 2px solid var(--line)
    }

    .pay small {
      font-weight: 400;
      color: var(--mute);
      font-size: 16px
    }

    .big {
      font-size: 44px
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px
    }

    .keys button {
      font-size: 28px;
      min-height: 68px
    }

    .amt {
      font-size: 36px;
      font-weight: 800;
      border: 3px solid var(--ink);
      border-radius: 14px;
      padding: 12px 16px;
      min-height: 72px
    }

    .amt.bad {
      border-color: var(--err)
    }

    .msg {
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0
    }

    .msg.err {
      background: #fee2e2;
      color: #7f1d1d
    }

    .msg.ok {
      background: #dcfce7;
      color: #14532d
    }

    .quick {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .quick button {
      flex: 1;
      min-height: 52px
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px
    }

    @media(max-width:860px) {
      .two {
        grid-template-columns: 1fr
      }
    }

    .qr {
      width: 248px;
      height: 248px;
      margin: auto;
      padding: 12px;
      background: #fff;
      border: 2px dashed var(--mute);
      border-radius: 12px;
      display: grid;
      place-items: center;
      text-align: center;
      color: #475569;
      font-family: monospace
    }

    .qr img,
    .qr canvas {
      max-width: 100%;
      height: auto
    }

    .bar {
      height: 10px;
      border-radius: 9px;
      background: var(--line);
      overflow: hidden;
      margin: 10px 0
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #6d28d9;
      transition: width 1.6s linear
    }

    .receipt {
      background: #fff;
      color: #111;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 16px;
      padding: 22px;
      max-width: 420px;
      border-radius: 8px;
      box-shadow: 0 4px 18px #0003
    }

    .receipt hr {
      border: 0;
      border-top: 1px dashed #888
    }

    .receipt .row {
      margin: 4px 0
    }

    .center {
      max-width: 560px;
      margin: auto;
      text-align: center
    }

    .check {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--ok);
      color: #fff;
      font-size: 56px;
      display: grid;
      place-items: center;
      margin: 0 auto 12px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--nav);
      color: #fff;
      padding: 14px 22px;
      border-radius: 99px;
      font-weight: 600;
      z-index: 9;
      max-width: 92%
    }

    .empty {
      text-align: center;
      color: var(--mute);
      padding: 40px 10px;
      border: 2px dashed var(--line);
      border-radius: 14px
    }

    @media print {

      header,
      .noprint,
      .toast {
        display: none !important
      }

      body {
        background: #fff
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <style id="desktop-pos">
    /* Shared desktop foundation; payment and receipt behavior stays unchanged. */
    :root,
    :root[data-theme="dark"],
    :root:not([data-theme="light"]) {
      --bg: #f6f7f9;
      --card: #fff;
      --ink: #18181b;
      --mute: #64646f;
      --nav: #641d32;
      --acc: #781f3a;
      --line: #e5e5eb;
      --ok: #15803d
    }

    body {
      font: 16px/1.5 "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif
    }

    .app-shell {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      min-height: 100vh
    }

    .sidebar {
      background: #fff;
      border-right: 1px solid var(--line);
      padding: 28px 20px;
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 28px
    }

    .store-image-area {
      height: 116px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #faf4f6;
      overflow: hidden
    }

    .store-image-area img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .brand {
      display: block;
      font-size: 21px;
      margin-top: 16px
    }

    .brand small {
      display: block;
      font-size: 13px;
      color: var(--mute);
      font-weight: 400;
      margin-top: 4px
    }

    .sidebar nav {
      display: grid;
      gap: 8px
    }

    .sidebar nav button {
      text-align: left;
      min-height: 48px;
      padding: 12px 16px;
      border: 0;
      background: transparent;
      font-size: 15px;
      color: var(--mute)
    }

    .sidebar nav button.active {
      color: var(--acc);
      background: #f7eaf0;
      box-shadow: inset 3px 0 var(--acc)
    }

    .sidebar nav button:disabled {
      opacity: .5
    }

    .sidebar nav .new-transaction {
      border: 1px solid var(--line);
      color: var(--ink);
      margin-bottom: 16px
    }

    .sidebar-note {
      margin-top: auto;
      font-size: 12px;
      color: var(--mute)
    }

    .workspace {
      min-width: 0
    }

    header {
      background: #fff;
      color: var(--ink);
      padding: 22px 32px;
      border-bottom: 1px solid var(--line);
      justify-content: center
    }

    .steps {
      gap: 12px;
      flex-wrap: nowrap
    }

    .steps span {
      border: 1px solid var(--line);
      color: var(--mute);
      background: #f8f8fa;
      font-size: 14px;
      padding: 10px 20px
    }

    .steps .on {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff
    }

    .steps .done {
      background: #f7eaf0;
      border-color: #e7ccd5;
      color: var(--acc)
    }

    main {
      max-width: 1500px;
      padding: 32px;
      margin: auto
    }

    h1 {
      font-size: clamp(24px, 2.3vw, 32px);
      letter-spacing: -.035em;
      font-weight: 800
    }

    h2 {
      font-size: 23px
    }

    p.sub {
      font-size: 15px
    }

    button {
      border: 1px solid var(--line);
      min-height: 48px;
      border-radius: 12px;
      font-size: 16px;
      transition: background .15s, box-shadow .15s
    }

    button:hover:not(:disabled) {
      box-shadow: 0 3px 12px #18181b0d
    }

    button.p {
      font-size: 16px;
      min-height: 54px
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--acc);
      outline-offset: 3px
    }

    .layout {
      grid-template-columns: minmax(0, 1fr) 340px;
      gap: 28px;
      align-items: start
    }

    .layout>section {
      min-width: 0
    }

    .toprow {
      margin-bottom: 20px;
      display: block
    }

    .browse-note {
      color: var(--mute);
      margin: 6px 0 0;
      font-size: 14px
    }

    .search-field {
      display: block;
      margin: 22px 0 16px
    }

    .search-field span {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px
    }

    .search-field input {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      background: #fff;
      color: var(--ink);
      font: inherit
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 22px
    }

    .chips button {
      border-radius: 99px;
      min-height: 44px;
      padding: 8px 18px;
      font-size: 14px
    }

    .chips .on {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff
    }

    .grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px
    }

    .item {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      min-height: 0;
      gap: 12px;
      box-shadow: 0 3px 12px #18181b04
    }

    .item.sel {
      border-color: var(--acc);
      box-shadow: 0 0 0 1px var(--acc)
    }

    .ico {
      flex: none;
      aspect-ratio: 1.2;
      min-height: 0;
      width: 100%
    }

    .item b {
      display: block;
      font-size: 16px
    }

    .item b em {
      display: block;
      color: var(--ink);
      font-size: 17px;
      margin-top: 4px
    }

    .add-label {
      color: var(--acc);
      font-size: 12px;
      font-weight: 700
    }

    .badge {
      top: 20px;
      right: 20px;
      min-width: 30px;
      height: 30px;
      box-shadow: 0 2px 8px #0002
    }

    .panel {
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 20px #18181b05
    }

    .order-cart {
      position: sticky;
      top: 24px
    }

    .order-cart h2 {
      margin: 0
    }

    .order-cart>.row:first-child {
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line)
    }

    .cart-items {
      margin-top: 18px
    }

    .line {
      padding: 14px;
      margin-bottom: 12px
    }

    .line small {
      color: var(--ink) !important;
      font-size: 13px
    }

    .line .row>div {
      min-width: 0
    }

    .q {
      gap: 8px
    }

    .q button {
      min-width: 44px;
      min-height: 44px;
      font-size: 22px
    }

    .q b {
      font-size: 16px
    }

    .del {
      font-size: 12px;
      min-width: 58px;
      min-height: 44px;
      padding: 0 8px;
      background: #fff5f5
    }

    .total {
      font-size: 28px;
      color: var(--ink) !important
    }

    .cart-total {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      margin: 18px 0
    }

    .empty {
      padding: 32px 16px;
      font-size: 14px;
      grid-column: 1/-1
    }

    .empty .big {
      font-size: 32px
    }

    .table-panel {
      padding: 0;
      overflow: auto
    }

    table {
      min-width: 530px
    }

    th {
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: .06em;
      color: var(--mute);
      background: #fafafb
    }

    th,
    td {
      padding: 18px 20px
    }

    td {
      font-size: 16px;
      color: var(--ink)
    }

    tr:last-child td {
      background: #faf7f8;
      border-bottom: 0
    }

    .review-actions {
      margin-top: 22px;
      display: flex;
      gap: 16px
    }

    .review-actions button {
      flex: 1
    }

    .review-actions .p {
      flex: 2
    }

    .pay button {
      min-height: 240px;
      font-size: 23px
    }

    .pay small {
      font-size: 14px
    }

    .two {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
    }

    .two>* {
      min-width: 0
    }

    .amt,
    .amt span,
    .quick button,
    .msg.ok,
    .msg.ok small {
      color: var(--ink) !important
    }

    .msg.ok {
      background: #f7f8fa;
      border: 1px solid var(--line)
    }

    .qr {
      max-width: 100%
    }

    .receipt {
      max-width: 100%;
      overflow-wrap: anywhere
    }

    .receipt .row {
      flex-wrap: wrap
    }

    .center .panel .row {
      flex-wrap: wrap
    }

    @media(min-width:1600px) {
      .layout {
        grid-template-columns: minmax(0, 1fr) 380px
      }

      .ico {
        aspect-ratio: 1.4
      }
    }

    @media(max-width:1200px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .app-shell {
        grid-template-columns: 200px minmax(0, 1fr)
      }

      main {
        padding: 24px
      }

      .layout {
        gap: 20px;
        grid-template-columns: minmax(0, 1fr) 310px
      }

      .sidebar {
        padding: 24px 16px
      }
    }

    @media(max-width:1000px) {

      .layout,
      .two {
        grid-template-columns: 1fr
      }

      .order-cart {
        position: static
      }

      .steps span {
        padding: 10px 13px
      }

      .pay {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:700px) {
      .app-shell {
        display: block
      }

      .sidebar {
        position: static;
        height: auto;
        padding: 16px;
        gap: 16px;
        border-right: 0;
        border-bottom: 1px solid var(--line)
      }

      .store-image-area {
        width: 64px;
        height: 64px;
        flex: none
      }

      .store-brand {
        display: flex;
        gap: 14px;
        align-items: center
      }

      .brand {
        margin: 0;
        font-size: 19px
      }

      .sidebar nav {
        display: flex;
        gap: 6px;
        flex-wrap: wrap
      }

      .sidebar nav button {
        font-size: 12px;
        padding: 8px 12px;
        min-height: 44px
      }

      .sidebar nav .new-transaction {
        margin: 0
      }

      .sidebar-note {
        display: none
      }

      header {
        padding: 16px 12px
      }

      .steps {
        width: 100%;
        gap: 6px
      }

      .steps span {
        flex: 1;
        text-align: center;
        font-size: 11px;
        padding: 9px 4px
      }

      main {
        padding: 20px 16px
      }

      .grid {
        gap: 12px
      }

      .item {
        padding: 10px
      }

      .item b {
        font-size: 14px
      }

      .review-actions {
        flex-direction: column
      }

      .row {
        flex-wrap: wrap
      }

      .q {
        flex-wrap: nowrap
      }

      th,
      td {
        padding: 14px 12px
      }

      .total {
        font-size: 26px
      }

      .pay button {
        min-height: 170px
      }

      .keys button {
        min-height: 60px
      }

      .two {
        gap: 20px
      }
    }

    @media print {
      .sidebar {
        display: none !important
      }

      .app-shell {
        display: block
      }

      main {
        padding: 0
      }

      .two {
        display: block
      }

      .receipt {
        box-shadow: none;
        margin: auto
      }

      .workspace {
        width: 100%
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar noprint" aria-label="Store navigation">
      <div class="store-brand">
        <div class="store-image-area">
          <img src="images/store.jpg" alt="Campus Store">
        </div>
        <div class="brand">Campus Store<small>Self-service kiosk</small></div>
      </div>
      <nav id="side-nav" aria-label="Transaction sections"></nav>
      <div class="sidebar-note">Campus Store POS<br>Choose. Review. Pay.</div>
    </aside>
    <div class="workspace">
      <header>
        <div class="steps" id="steps" aria-label="Transaction progress"></div>
      </header>
      <main id="app"></main>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script>
    const PRODUCTS = [
      {
        id: 1,
        name: "Coffee",
        cat: "Drinks",
        img: "images/coffee.jpg",
        price: 45,
        icon: "☕",
        bg: "#ffedd5"
      },
      {
        id: 2,
        name: "Sandwich",
        cat: "Food",
        img: "images/sandwich.jpg",
        price: 50,
        icon: "🥪",
        bg: "#fef3c7"
      },
      {
        id: 3,
        name: "Soft Drink",
        cat: "Drinks",
        img: "images/soft-drink.jpg",
        price: 35,
        icon: "🥤",
        bg: "#fee2e2"
      },
      {
        id: 4,
        name: "Cookies",
        cat: "Snacks",
        img: "images/cookies.jpg",
        price: 25,
        icon: "🍪",
        bg: "#f3e8d8"
      },
      {
        id: 5,
        name: "Bottled Water",
        cat: "Drinks",
        img: "images/bottled-water.jpg",
        price: 20,
        icon: "💧",
        bg: "#dbeafe"
      },
      {
        id: 6,
        name: "Chocolate",
        cat: "Snacks",
        img: "images/chocolate.jpg",
        price: 25,
        icon: "🍫",
        bg: "#e7ddd8"
      }
    ];

    const peso = n => "₱" + n.toLocaleString("en-PH", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    let S = {
      screen: "order",
      cart: {},
      method: null,
      paid: "",
      error: "",
      txn: null
    };

    let seq = 0;

    try {
      seq = +localStorage.getItem("kiosk_seq") || 0
    } catch (e) { }

    const items = () => PRODUCTS
      .filter(p => S.cart[p.id])
      .map(p => ({
        ...p,
        qty: S.cart[p.id],
        sub: p.price * S.cart[p.id]
      }));

    const total = () => items().reduce((a, i) => a + i.sub, 0);

    const count = () => items().reduce((a, i) => a + i.qty, 0);

    function toast(t) {
      const e = document.getElementById("toast");
      e.textContent = t;
      e.hidden = false;
      clearTimeout(toast.t);
      toast.t = setTimeout(() => e.hidden = true, 1800)
    }

    function setCat(c) { S.cat = c; render() }

    const matchingProducts = () => PRODUCTS.filter(p =>
      (!S.cat || S.cat === "All" || p.cat === S.cat) &&
      p.name.toLowerCase().includes((S.search || "").toLowerCase())
    );

    function setSearch(value) {
      S.search = value;
      const input = document.getElementById("product-search");
      const cursor = input.selectionStart;
      render();
      const next = document.getElementById("product-search");
      next.focus();
      next.setSelectionRange(cursor, cursor);
    }

    function sidebar() {
      const current = STEP[S.screen];
      // Reuse existing navigation and reset functions; completed transactions stay read-only.
      const editable = current < 4;
      document.getElementById("side-nav").innerHTML =
        `<button class="new-transaction" onclick="newTxn()">+ New Transaction</button>` +
        [["Order", "order", 1], ["Review", "review", 2], ["Payment", "method", 3], ["Receipt", "receipt", 4]].map(([label, screen, step]) => {
          const active = current === step;
          const allowed = step === 4 ? S.screen === "receipt" : editable && (step === 1 || count() > 0);
          return `<button class="${active ? 'active' : ''}" ${active ? 'aria-current="step"' : ''} ${allowed ? '' : 'disabled'} onclick="go('${screen}')">${label}</button>`;
        }).join("");
    }

    function go(s) {
      S.screen = s;
      S.error = "";
      render()
    }

    function add(id) {
      S.cart[id] = (S.cart[id] || 0) + 1;
      toast("Product added — " + PRODUCTS.find(p => p.id == id).name);
      render()
    }

    function chg(id, d) {
      const n = (S.cart[id] || 0) + d;

      if (n <= 0) {
        delete S.cart[id];
        toast("Item removed")
      } else {
        S.cart[id] = n
      }

      render()
    }

    function rem(id) {
      delete S.cart[id];
      toast("Item removed");
      render()
    }

    function newTxn() {
      S = {
        screen: "order",
        cart: {},
        method: null,
        paid: "",
        error: "",
        txn: null
      };

      render();
      toast("New transaction started — previous order cleared")
    }

    function complete(method, paid) {
      seq++;

      try {
        localStorage.setItem("kiosk_seq", seq)
      } catch (e) { }

      S.txn = {
        no: "TXN-" + new Date().getFullYear() + "-" + String(seq).padStart(5, "0"),
        date: new Date(),
        items: items(),
        total: total(),
        method,
        paid,
        change: paid - total()
      };

      go("success")
    }

    function key(k) {
      if (k === "C") {
        S.paid = ""
      } else if (k === "B") {
        S.paid = S.paid.slice(0, -1)
      } else if (S.paid.length < 7) {
        S.paid += k
      }

      S.error = "";
      render()
    }

    function quick(v) {
      S.paid = String(v === "x" ? total() : v);
      S.error = "";
      render()
    }

    function payCash() {
      const v = S.paid === "" ? NaN : Number(S.paid);

      if (isNaN(v) || v < 0) {
        S.error = "Invalid amount. Enter the amount you are paying.";
        return render()
      }

      if (v < total()) {
        S.error = "Insufficient payment. Please enter at least " +
          peso(total()) +
          ". You are short by " +
          peso(total() - v) +
          ".";

        return render()
      }

      complete("Cash", v)
    }

    function cardPay() {
      const b = document.getElementById("pb");
      document.getElementById("proc").hidden = false;
      b.disabled = true;

      requestAnimationFrame(() =>
        document.querySelector(".bar i").style.width = "100%"
      );

      setTimeout(() => complete("Credit/Debit Card", total()), 1700)
    }

    const STEP = {
      order: 1,
      review: 2,
      method: 3,
      cash: 3,
      qr: 3,
      card: 3,
      success: 4,
      receipt: 4
    };

    function stepper() {
      const n = STEP[S.screen];
      const l = ["Order", "Review", "Payment", "Receipt"];

      document.getElementById("steps").innerHTML = l.map((t, i) =>
        `<span class="${i + 1 === n ? "on" : i + 1 < n ? "done" : ""}">${i + 1 < n ? "✓ " : i + 1 + " "}${t}</span>`
      ).join("")
    }

    function cartHTML() {
      const it = items();

      if (!it.length) {
        return `
          <div class="empty">
            <div class="big">🛒</div>
            <b>Your order is empty</b><br>
            Tap a product to add it to your order.
          </div>
        `
      }

      return it.map(i => `
        <div class="line">
          <div class="row">
            <div>
              <b>${i.name}</b><br>
              <small style="color:var(--mute)">${peso(i.price)} each</small>
            </div>
            <button
              class="del"
              aria-label="Remove ${i.name}"
              onclick="rem(${i.id})"
            >Remove</button>
          </div>

          <div class="row">
            <div class="q">
              <button
                aria-label="Decrease ${i.name}"
                onclick="chg(${i.id},-1)"
              >−</button>

              <b style="min-width:28px;text-align:center">${i.qty}</b>

              <button
                aria-label="Increase ${i.name}"
                onclick="chg(${i.id},1)"
                style="background:var(--ink);color:var(--card)"
              >+</button>
            </div>

            <b>${peso(i.sub)}</b>
          </div>
        </div>
      `).join("")
    }

    const sumTable = () => `
      <table>
        <tr>
          <th>Product</th>
          <th>Quantity</th>
          <th>Unit price</th>
          <th>Subtotal</th>
        </tr>

        ${items().map(i => `
          <tr>
            <td><b>${i.name}</b></td>
            <td>${i.qty}</td>
            <td>${peso(i.price)}</td>
            <td><b>${peso(i.sub)}</b></td>
          </tr>
        `).join("")}

        <tr>
          <td colspan="3">
            <b>Total Amount</b> (${count()} items)
          </td>
          <td class="total" style="color:var(--ink)">
            ${peso(total())}
          </td>
        </tr>
      </table>
    `;

    const dueBox = l => `
      <div class="panel row">
        <span style="color:var(--mute)">${l}</span>
        <span class="total" style="color:var(--ink)">
          ${peso(total())}
        </span>
      </div>
    `;

    const V = {
      order: () => `
        <div class="layout">
          <section>
            <div class="toprow">
              <h1>Tap a product to add it</h1>
              <p class="browse-note">Find your favorites and build your order.</p>
            </div>
            <label class="search-field" for="product-search">
              <span>Product search</span>
              <input id="product-search" type="search" placeholder="Search products..." autocomplete="off" oninput="setSearch(this.value)">
            </label>
            <div class="chips" aria-label="Product categories">${["All", "Drinks", "Food", "Snacks"].map(c => `<button class="${(S.cat || "All") === c ? "on" : ""}" aria-pressed="${(S.cat || "All") === c}" onclick="setCat('${c}')">${c}</button>`).join("")}</div>

            <div class="grid">
              ${matchingProducts().map(p => `
                <button
                  class="item ${S.cart[p.id] ? "sel" : ""}"
                  aria-label="Add ${p.name} to order"
                  onclick="add(${p.id})"
                >
                  ${S.cart[p.id] ? `<span class="badge">${S.cart[p.id]}</span>` : ""}

                  <div
                    class="ico"
                    style="background:${p.bg}"
                  ><img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.replaceWith(document.createTextNode('${p.icon}'))"></div>

                  <b>
                    ${p.name}
                    <em>${peso(p.price)}</em>
                  </b>
                  <span class="add-label">+ Add to order</span>
                </button>
              `).join("")}
              ${matchingProducts().length ? "" : '<div class="empty" role="status">No products found.</div>'}
            </div>
          </section>

          <aside
            class="panel order-cart"
          >
            <div class="row">
              <h2 style="margin:0">Your Order</h2>
              <span style="color:var(--mute)">${count()} items</span>
            </div>

            <div class="cart-items">${cartHTML()}</div>

            <div class="row cart-total">
              <b>Total</b>
              <span class="total">${peso(total())}</span>
            </div>

            <button
              class="p"
              style="width:100%"
              ${total() ? "" : "disabled"}
              onclick="go('review')"
            >
              Proceed to Review &rarr;
            </button>
          </aside>
        </div>
      `,

      review: () => `
        <h1>Review your order</h1>

        <p class="sub">
          Check your items before paying. Tap Back to make changes — your items stay in the cart.
        </p>

        <div class="panel table-panel">
          ${sumTable()}
        </div>

        <div class="review-actions">
          <button
            style="flex:1"
            onclick="go('order')"
          >
            &larr; Back to Order
          </button>

          <button
            class="p"
            style="flex:2"
            onclick="go('method')"
          >
            Continue to Payment →
          </button>
        </div>
      `,

      method: () => `
        <div class="row" style="align-items:flex-start;flex-wrap:wrap">
          <div>
            <h1>How would you like to pay?</h1>
            <p class="sub">Tap one of the options below.</p>
          </div>

          ${dueBox("Amount due")}
        </div>

        <div class="pay">
          <button onclick="S.paid='';go('cash')">
            <span class="big">💵</span>
            Cash
            <small>
              Enter the amount you are paying. Change is computed for you.
            </small>
          </button>

          <button onclick="go('qr')">
            <span class="big">▦</span>
            QR Payment
            <small>
              Scan with a supported e-wallet or banking app.
            </small>
          </button>

          <button onclick="go('card')">
            <span class="big">💳</span>
            Credit / Debit Card
            <small>
              Tap, insert, or swipe your card at the reader.
            </small>
          </button>
        </div>

        <br>

        <button onclick="go('review')">
          ← Back to Order
        </button>
      `,

      cash: () => {
        const v = S.paid === "" ? null : Number(S.paid);
        const ok = v !== null && v >= total();

        return `
          <div class="two">
            <section>
              <h1 class="ttl"><span class="ticon">💵</span> Cash Payment</h1>

              ${dueBox("Total amount")}

              <p class="lbl">
                Amount paid
              </p>

              <div class="amt ${S.error ? "bad" : ""}">
                ${v === null
            ? '<span style="color:var(--mute)">₱0.00</span>'
            : peso(v)
          }
              </div>

              ${S.error
            ? `
                    <div class="msg err" role="alert" style="display:flex;gap:12px;align-items:center"><span class="eic">!</span><span>
                      <b>${S.error.split(". ")[0]}.</b><br>
                      ${S.error.split(". ").slice(1).join(". ")}</span>
                    </div>
                  `
            : ""
          }

              <p class="lbl">Quick amounts</p>
              <div class="quick">
                <button class="${v === total() ? 'on' : ''}" onclick="quick('x')">
                  Exact
                </button>

                ${[200, 500, 1000].map(n => `
                  <button class="${v === n ? 'on' : ''}" onclick="quick(${n})">
                    ₱${n.toLocaleString()}
                  </button>
                `).join("")}
              </div>

              <div
                class="msg ${ok ? "ok" : ""}"
                style="${ok ? "" : "background:var(--card);border:1px solid var(--line)"}"
              >
                <div class="row">
                  <div><b>Change</b>${ok ? `<br><small>${peso(v)} − ${peso(total())}</small>` : ""}</div>
                  <span class="total">
                    ${ok ? peso(v - total()) : "—"}
                  </span>
                </div>
              </div>
            </section>

            <section>
              <div class="keys">
                ${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `
                  <button onclick="key('${n}')">${n}</button>
                `).join("")}

                <button onclick="key('C')">
                  Clear
                </button>

                <button onclick="key('0')">
                  0
                </button>

                <button
                  aria-label="Backspace"
                  onclick="key('B')"
                >
                  ⌫
                </button>
              </div>

              <br>

              <button
                class="p"
                style="width:100%"
                onclick="payCash()"
              >
                Pay Now
              </button>

              <br><br>

              <button
                style="width:100%"
                onclick="go('method')"
              >
                ← Change payment method
              </button>
            </section>
          </div>
        `
      },

      qr: () => `
        <div class="two">
          <div class="panel">
            <div class="qr" id="qrbox">QR CODE<br>placeholder</div>

            <p style="text-align:center;color:var(--mute)">
              Ref: QR-${"TXN-" + new Date().getFullYear() + "-" + String(seq + 1).padStart(5, "0")}
            </p>
          </div>

          <section>
            <h1>▦ QR Payment</h1>

            ${dueBox("Amount to pay")}

            <ol style="font-size:20px;line-height:1.7">
              <li>
                Scan the QR code using your supported payment application.
              </li>
              <li>
                Check that the amount is ${peso(total())} and approve it in your app.
              </li>
              <li>
                Tap Confirm Payment below.
              </li>
            </ol>

            <div class="row" style="gap:12px">
              <button
                style="flex:1"
                onclick="go('method')"
              >
                ← Back
              </button>

              <button
                class="p"
                style="flex:2"
                onclick="complete('QR Payment',total())"
              >
                ✓ Confirm Payment
              </button>
            </div>

            <p class="sub">
              Simulated payment — the amount paid equals the total, with ₱0.00 change.
            </p>
          </section>
        </div>
      `,

      card: () => `
        <div class="two">
          <div
            class="panel center"
            style="width:100%"
          >
            <div
              class="big"
              style="font-size:90px"
            >
              💳
            </div>

            <b>Tap, insert, or swipe</b>
          </div>

          <section>
            <h1>💳 Credit / Debit Card</h1>

            ${dueBox("Amount due")}

            <h3>
              Please tap, insert, or swipe your card.
            </h3>

            <div
              id="proc"
              class="msg"
              style="background:#ede9fe;color:#4c1d95"
              hidden
            >
              <b>Processing payment…</b>

              <div class="bar">
                <i></i>
              </div>

              Do not remove your card until the payment is complete.
            </div>

            <div class="row" style="gap:12px">
              <button
                style="flex:1"
                onclick="go('method')"
              >
                ← Back
              </button>

              <button
                id="pb"
                class="p"
                style="flex:2"
                onclick="cardPay()"
              >
                Process Payment
              </button>
            </div>
          </section>
        </div>
      `,

      success: () => {
        const t = S.txn;

        return `
          <div class="center">
            <div class="check">✓</div>

            <h1 style="color:var(--ok)">
              Payment Successful
            </h1>

            <p class="sub">
              Transaction completed successfully. Thank you!
            </p>

            <div class="panel">
              ${[
            ["Transaction No.", t.no],
            ["Payment method", t.method],
            ["Transaction amount", peso(t.total)],
            ["Amount paid", peso(t.paid)],
            ["Change", peso(t.change)]
          ].map(r => `
                  <div
                    class="row"
                    style="padding:9px 0;border-bottom:1px solid var(--line)"
                  >
                    <span style="color:var(--mute)">
                      ${r[0]}
                    </span>
                    <b>${r[1]}</b>
                  </div>
                `).join("")
          }
            </div>

            <br>

            <button
              class="p"
              style="width:100%"
              onclick="go('receipt')"
            >
              🧾 View Receipt
            </button>
          </div>
        `
      },

      receipt: () => {
        const t = S.txn;

        return `
          <div
            class="two"
            style="align-items:center"
          >
            <div class="receipt">
              <div style="text-align:center">
                <b style="font-size:20px">
                  CAMPUS STORE POS
                </b>
                <br>
                <small>
                  Self-Service Kiosk · Official Digital Receipt
                </small>
              </div>

              <hr>

              <div class="row">
                <span>Transaction No.</span>
                <b>${t.no}</b>
              </div>

              <div class="row">
                <span>Date</span>
                <span>
                  ${t.date.toLocaleString("en-PH", {
          dateStyle: "long",
          timeStyle: "short"
        })}
                </span>
              </div>

              <hr>

              ${t.items.map(i => `
                  <div class="row">
                    <b>${i.name}</b>
                    <b>${peso(i.sub)}</b>
                  </div>

                  <div>
                    ${i.qty} × ${peso(i.price)}
                  </div>
                `).join("")
          }

              <hr>

              <div
                class="row"
                style="font-size:20px"
              >
                <b>TOTAL</b>
                <b>${peso(t.total)}</b>
              </div>

              <div class="row">
                <span>Payment method</span>
                <span>${t.method}</span>
              </div>

              <div class="row">
                <span>Amount paid</span>
                <span>${peso(t.paid)}</span>
              </div>

              <div class="row">
                <span>Change</span>
                <span>${peso(t.change)}</span>
              </div>

              <div class="row">
                <span>Status</span>
                <b style="color:#15803d">
                  Payment Successful
                </b>
              </div>

              <hr>

              <div style="text-align:center">
                Thank you for your purchase!
              </div>
            </div>

            <section class="noprint">
              <h1>Your receipt</h1>

              <p class="sub">
                Keep this for your records. Tap New Transaction when you are done — your order and payment details will be cleared.
              </p>

              <button
                class="p"
                style="width:100%"
                onclick="newTxn()"
              >
                + New Transaction
              </button>

              <br><br>

              <button
                style="width:100%"
                onclick="window.print()"
              >
                🖨 Print Receipt
              </button>

              <p class="sub">
                Printing is optional — the digital receipt is your proof of payment.
              </p>
            </section>
          </div>
        `
      }
    };

    function render() {
      stepper();
      sidebar();
      const appEl = document.getElementById("app");
      appEl.innerHTML = V[S.screen]();
      if (S.screen === "order") document.getElementById("product-search").value = S.search || "";
      if (render.last !== S.screen) {
        appEl.classList.remove("enter"); void appEl.offsetWidth; appEl.classList.add("enter");
        window.scrollTo(0, 0); render.last = S.screen
      }
      if (S.screen === "qr") drawQR()
    }

    // Builds a real, scannable QR code. The payload is simulated (not a bank/e-wallet format).
    function drawQR() {
      const box = document.getElementById("qrbox");
      if (!box || typeof QRCode === "undefined") return; // offline: keep the placeholder
      const ref = "QR-TXN-" + new Date().getFullYear() + "-" + String(seq + 1).padStart(5, "0");
      const payload = "CAMPUSSTORE|" + ref + "|PHP " + total().toFixed(2);
      box.textContent = "";
      new QRCode(box, { text: payload, width: 220, height: 220, colorDark: "#111827", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M })
    }

    render();
  </script>
</body>

</html>
