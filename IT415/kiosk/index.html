<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campus Store Kiosk</title>
  <style>
    :root {
      --bg: #edf0f5;
      --card: #fff;
      --ink: #111827;
      --mute: #5b6473;
      --nav: #101828;
      --acc: #c2410c;
      --line: #dfe3ea;
      --ok: #15803d;
      --err: #b91c1c;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1220;
        --card: #162033;
        --ink: #f1f5f9;
        --mute: #9aa6b8;
        --line: #2a3750;
        --acc: #ea580c
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b1220;
      --card: #162033;
      --ink: #f1f5f9;
      --mute: #9aa6b8;
      --line: #2a3750;
      --acc: #ea580c
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 18px/1.35 "Segoe UI", system-ui, sans-serif;
      min-height: 100vh
    }

    header {
      background: var(--nav);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      gap: 12px;
      flex-wrap: wrap
    }

    .brand {
      display: flex;
      gap: 12px;
      align-items: center;
      font-weight: 700
    }

    .logo {
      background: var(--acc);
      border-radius: 10px;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center
    }

    .steps {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .steps span {
      padding: 8px 14px;
      border-radius: 99px;
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 15px;
      font-weight: 600
    }

    .steps .on {
      background: #fff;
      color: var(--nav)
    }

    .steps .done {
      background: #1e293b;
      color: #e2e8f0
    }

    main {
      padding: 20px;
      max-width: 1200px;
      margin: auto
    }

    h1 {
      font-size: 30px;
      margin: 0 0 6px
    }

    p.sub {
      color: var(--mute);
      margin: 0 0 16px
    }

    button {
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border-radius: 14px;
      border: 2px solid var(--ink);
      background: var(--card);
      color: var(--ink);
      min-height: 56px;
      padding: 12px 20px;
      touch-action: manipulation
    }

    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px
    }

    button.p {
      background: var(--acc);
      border-color: var(--acc);
      color: #fff;
      font-size: 20px
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 20px
    }

    @media(max-width:860px) {
      .layout {
        grid-template-columns: 1fr
      }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px
    }

    .item {
      position: relative;
      text-align: left;
      padding: 12px;
      border: 2px solid var(--line);
      min-height: 190px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .item.sel {
      border-color: var(--acc)
    }

    .ico {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 54px;
      min-height: 130px
    }

    .ico img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .item b {
      display: flex;
      justify-content: space-between;
      gap: 6px
    }

    .item b em {
      color: var(--acc);
      font-style: normal
    }

    .badge {
      position: absolute;
      top: 18px;
      right: 18px;
      background: var(--acc);
      color: #fff;
      border-radius: 99px;
      min-width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      font-size: 15px
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px
    }

    .line {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .q {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px
    }

    .q button {
      min-height: 48px;
      min-width: 48px;
      padding: 0;
      font-size: 24px
    }

    .del {
      border-color: #fca5a5;
      color: var(--err);
      min-height: 44px;
      min-width: 44px;
      padding: 0
    }

    .total {
      font-size: 34px;
      font-weight: 800
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      padding: 12px 8px;
      text-align: right;
      border-bottom: 1px solid var(--line)
    }

    th:first-child,
    td:first-child {
      text-align: left
    }

    .pay {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px
    }

    .pay button {
      min-height: 210px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      border: 2px solid var(--line)
    }

    .pay small {
      font-weight: 400;
      color: var(--mute);
      font-size: 16px
    }

    .big {
      font-size: 44px
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px
    }

    .keys button {
      font-size: 28px;
      min-height: 68px
    }

    .amt {
      font-size: 36px;
      font-weight: 800;
      border: 3px solid var(--ink);
      border-radius: 14px;
      padding: 12px 16px;
      min-height: 72px
    }

    .amt.bad {
      border-color: var(--err)
    }

    .msg {
      border-radius: 12px;
      padding: 12px;
      margin: 10px 0
    }

    .msg.err {
      background: #fee2e2;
      color: #7f1d1d
    }

    .msg.ok {
      background: #dcfce7;
      color: #14532d
    }

    .quick {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 10px 0
    }

    .quick button {
      flex: 1;
      min-height: 52px
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px
    }

    @media(max-width:860px) {
      .two {
        grid-template-columns: 1fr
      }
    }

    .qr {
      width: 248px;
      height: 248px;
      margin: auto;
      padding: 12px;
      background: #fff;
      border: 2px dashed var(--mute);
      border-radius: 12px;
      display: grid;
      place-items: center;
      text-align: center;
      color: #475569;
      font-family: monospace
    }

    .qr img,
    .qr canvas {
      max-width: 100%;
      height: auto
    }

    .bar {
      height: 10px;
      border-radius: 9px;
      background: var(--line);
      overflow: hidden;
      margin: 10px 0
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #6d28d9;
      transition: width 1.6s linear
    }

    .receipt {
      background: #fff;
      color: #111;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 16px;
      padding: 22px;
      max-width: 420px;
      border-radius: 8px;
      box-shadow: 0 4px 18px #0003
    }

    .receipt hr {
      border: 0;
      border-top: 1px dashed #888
    }

    .receipt .row {
      margin: 4px 0
    }

    .center {
      max-width: 560px;
      margin: auto;
      text-align: center
    }

    .check {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--ok);
      color: #fff;
      font-size: 56px;
      display: grid;
      place-items: center;
      margin: 0 auto 12px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: var(--nav);
      color: #fff;
      padding: 14px 22px;
      border-radius: 99px;
      font-weight: 600;
      z-index: 9;
      max-width: 92%
    }

    .empty {
      text-align: center;
      color: var(--mute);
      padding: 40px 10px;
      border: 2px dashed var(--line);
      border-radius: 14px
    }

    @media print {
      header,
      .noprint,
      .toast {
        display: none !important
      }

      body {
        background: #fff
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style id="sample-match">
    /* ===== Matches the instructor sample UI: palette, header, spacing, sizes ===== */
    :root,:root:not([data-theme="light"]){--bg:#edf0f5;--card:#fff;--ink:#111827;--mute:#566074;--nav:#101828;--acc:#c2410c;--line:#dde2ea;--ok:#15803d;--err:#b91c1c}
    @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#edf0f5;--card:#fff;--ink:#111827;--mute:#566074;--line:#dde2ea;--acc:#c2410c}}
    body{font-family:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;font-size:18px;background:var(--bg);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
    header{height:86px;padding:0 35px;flex-wrap:nowrap;box-shadow:none}

    .brand{font-size:20px;line-height:1.15}.brand small{font-size:14px;font-weight:500!important}
    .steps{gap:10px}.steps span{padding:10px 17px;font-size:16px;font-weight:700;border:1px solid #2b3547;background:transparent;color:#8b95a7}
    .steps .done{background:#1b2436;color:#cbd5e1;border-color:#1b2436}.steps .on{background:#fff;color:var(--nav);border-color:#fff}
    main{max-width:none;padding:0}main::after{content:"";display:block;height:48px}
    main>*:not(.layout){max-width:1180px;margin-left:auto;margin-right:auto;padding-left:28px;padding-right:28px}
    main>*:first-child:not(.layout){margin-top:48px}
    h1{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}p.sub{font-size:19px;color:var(--mute);margin:0 0 24px}
    button{border-radius:16px;min-height:62px;font-weight:700;border:2px solid var(--ink);background:#fff;transition:transform .1s}
    button:active:not(:disabled){transform:scale(.97)}
    button.p{background:var(--acc);border-color:var(--acc);color:#fff;min-height:76px;font-size:24px;border-radius:16px;box-shadow:none}
    button:disabled{background:#e5e7eb;border-color:#e5e7eb;color:#6b7280;opacity:1}
    /* order screen */
    .layout{grid-template-columns:1fr 454px;gap:0;align-items:stretch}
    .layout>section{padding:34px 36px}.toprow{align-items:center;margin-bottom:22px}.toprow h1{font-size:34px;margin:0}
    .chips{display:flex;gap:10px}.chips button{min-height:52px;padding:0 24px;border:1px solid var(--line);border-radius:99px;font-size:18px}.chips .on{background:var(--nav);border-color:var(--nav);color:#fff}
    .grid{grid-template-columns:repeat(3,1fr);gap:24px}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}}
    .item{padding:18px;border:2px solid var(--line);border-radius:20px;min-height:0;gap:14px;background:#fff;box-shadow:none}
    .item.sel{border:3px solid var(--acc);padding:17px}
    .ico{flex:none;aspect-ratio:1/.98;min-height:0;border-radius:14px}
    .item b{padding:0;font-size:22px;font-weight:700}.item b em{color:var(--acc);font-size:22px;font-weight:800;background:none;padding:0}
    .badge{top:30px;right:30px;min-width:40px;height:40px;font-size:18px;font-weight:800}
    .layout>aside.panel{position:static!important;border-radius:0;border:0;border-left:1px solid var(--line);background:#fff;padding:30px;box-shadow:none;display:flex;flex-direction:column;min-height:calc(100vh - 86px)}
    aside h2{font-size:30px;font-weight:800}
    .line{border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
    .line b{font-size:21px}.line small{font-size:16px}
    .q{gap:14px}.q button{min-width:52px;min-height:52px;border-radius:12px;border:1px solid var(--line);background:#f3f4f8;font-size:24px}
    .q button:last-child{background:var(--nav);border-color:var(--nav);color:#fff}.q b{font-size:24px!important}
    .line .row>b{font-size:25px}
    .del{min-width:50px;min-height:50px;border-radius:12px;background:#fee2e2;border-color:#fee2e2}
    aside .row:nth-last-of-type(1){border-top:0}
    aside>.row[style]{margin-top:auto!important;padding-top:18px;border-top:2px dashed var(--line)}
    .total{font-size:44px;font-weight:800;letter-spacing:-.02em}
    .empty{background:#fff;border:2px dashed var(--line);border-radius:18px;padding:70px 20px;flex:1}
    /* review / tables */
    .panel{border-radius:20px;border:1px solid var(--line);box-shadow:none;padding:0;overflow:hidden}
    th{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);background:#f8f9fb;padding:18px 24px}td{font-size:28px;padding:24px;font-weight:700}
    td:nth-child(3){color:var(--mute);font-weight:500}tr:last-child td{background:#fff4ea;border-top:2px solid #fed7aa}
    tr:last-child .total{color:#9a3412;font-size:56px}
    .row[style*="gap:16px"] button{min-height:84px;font-size:24px}
    /* payment method */
    .pay{gap:26px}.pay button{border:2px solid var(--line);border-radius:28px;min-height:420px;font-size:36px;font-weight:800;gap:14px;background:#fff;box-shadow:none}
    .pay .big{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;font-size:60px;margin-bottom:14px}
    .pay button:nth-child(1) .big{background:#dcfce7}.pay button:nth-child(2) .big{background:#dbeafe}.pay button:nth-child(3) .big{background:#ede9fe}
    .pay small{font-size:20px;line-height:1.35;max-width:300px}
    div.panel.row{padding:14px 26px;border-radius:18px;background:#fff}div.panel.row .total{font-size:42px;color:#9a3412}
    /* cash */
    .ttl{display:flex;align-items:center;gap:14px}.ticon{width:52px;height:52px;border-radius:14px;background:#dcfce7;display:grid;place-items:center;font-size:28px}
    .lbl{font-weight:700;margin:18px 0 8px;font-size:18px}.lbl+.quick{margin-top:0}
    .amt{font-size:46px;font-weight:800;border-radius:16px;border:3px solid var(--nav);background:#fff;min-height:84px}.amt.bad{border-color:var(--err)}
    .msg.err{background:#fee2e2;border:1px solid #fca5a5;color:#7f1d1d;border-radius:14px}.eic{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--err);display:grid;place-items:center;font-weight:800;color:var(--err);flex:none}
    .quick button{border:1px solid var(--line);border-radius:12px;min-height:60px;font-size:20px}.quick button.on{background:var(--nav);border-color:var(--nav);color:#fff}
    .msg.ok{background:#dcfce7;border:2px solid #86efac;color:#14532d}.msg.ok small{font-weight:600}.msg .total{font-size:42px}
    .keys{gap:14px}.keys button{border:1px solid var(--line);border-radius:16px;font-size:34px;min-height:100px;background:#fff}.keys button:nth-child(n+10){background:#f3f4f8}
    /* qr / card / success / receipt */
    .qr{border:0;border-radius:0;background:#fff}.two>.panel{padding:30px;border-radius:28px}
    ol{list-style:none;counter-reset:s;padding:0}ol li{counter-increment:s;display:flex;gap:14px;align-items:center;margin:14px 0}
    ol li::before{content:counter(s);width:40px;height:40px;border-radius:50%;background:var(--nav);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
    .center{max-width:560px!important}.center .panel{text-align:left}.center .panel .row{padding:16px 24px!important}
    .check{width:120px;height:120px;font-size:68px;background:var(--ok)}
    .receipt{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;border-radius:10px;box-shadow:0 6px 24px #0f172a1f;max-width:510px;padding:30px}
    .toast{background:var(--nav);bottom:30px;font-size:18px;box-shadow:none}
    @media(max-width:860px){.layout{grid-template-columns:1fr}.layout>section{padding:20px 14px}.layout>aside.panel{min-height:0}header{height:auto;padding:12px 16px;flex-wrap:wrap}}
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div class="logo">CS</div>
      <div>
        Campus Store<br>
        <small style="font-weight:400;color:#94a3b8">Self-service kiosk</small>
      </div>
    </div>

    <div class="steps" id="steps"></div>
  </header>

  <main id="app"></main>
  <div id="toast" class="toast" hidden></div>

  <script>
    const PRODUCTS = [
      {
        id: 1,
        name: "Coffee",
        cat: "Drinks",
        img: "images/coffee.jpg",
        price: 45,
        icon: "☕",
        bg: "#ffedd5"
      },
      {
        id: 2,
        name: "Sandwich",
        cat: "Food",
        img: "images/sandwich.jpg",
        price: 50,
        icon: "🥪",
        bg: "#fef3c7"
      },
      {
        id: 3,
        name: "Soft Drink",
        cat: "Drinks",
        img: "images/soft-drink.jpg",
        price: 35,
        icon: "🥤",
        bg: "#fee2e2"
      },
      {
        id: 4,
        name: "Cookies",
        cat: "Snacks",
        img: "images/cookies.jpg",
        price: 25,
        icon: "🍪",
        bg: "#f3e8d8"
      },
      {
        id: 5,
        name: "Bottled Water",
        cat: "Drinks",
        img: "images/bottled-water.jpg",
        price: 20,
        icon: "💧",
        bg: "#dbeafe"
      },
      {
        id: 6,
        name: "Chocolate",
        cat: "Snacks",
        img: "images/chocolate.jpg",
        price: 25,
        icon: "🍫",
        bg: "#e7ddd8"
      }
    ];

    const peso = n => "₱" + n.toLocaleString("en-PH", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    let S = {
      screen: "order",
      cart: {},
      method: null,
      paid: "",
      error: "",
      txn: null
    };

    let seq = 0;

    try {
      seq = +localStorage.getItem("kiosk_seq") || 0
    } catch (e) {}

    const items = () => PRODUCTS
      .filter(p => S.cart[p.id])
      .map(p => ({
        ...p,
        qty: S.cart[p.id],
        sub: p.price * S.cart[p.id]
      }));

    const total = () => items().reduce((a, i) => a + i.sub, 0);

    const count = () => items().reduce((a, i) => a + i.qty, 0);

    function toast(t) {
      const e = document.getElementById("toast");
      e.textContent = t;
      e.hidden = false;
      clearTimeout(toast.t);
      toast.t = setTimeout(() => e.hidden = true, 1800)
    }

    function setCat(c) { S.cat = c; render() }

    function go(s) {
      S.screen = s;
      S.error = "";
      render()
    }

    function add(id) {
      S.cart[id] = (S.cart[id] || 0) + 1;
      toast("Product added — " + PRODUCTS.find(p => p.id == id).name);
      render()
    }

    function chg(id, d) {
      const n = (S.cart[id] || 0) + d;

      if (n <= 0) {
        delete S.cart[id];
        toast("Item removed")
      } else {
        S.cart[id] = n
      }

      render()
    }

    function rem(id) {
      delete S.cart[id];
      toast("Item removed");
      render()
    }

    function newTxn() {
      S = {
        screen: "order",
        cart: {},
        method: null,
        paid: "",
        error: "",
        txn: null
      };

      render();
      toast("New transaction started — previous order cleared")
    }

    function complete(method, paid) {
      seq++;

      try {
        localStorage.setItem("kiosk_seq", seq)
      } catch (e) {}

      S.txn = {
        no: "TXN-" + new Date().getFullYear() + "-" + String(seq).padStart(5, "0"),
        date: new Date(),
        items: items(),
        total: total(),
        method,
        paid,
        change: paid - total()
      };

      go("success")
    }

    function key(k) {
      if (k === "C") {
        S.paid = ""
      } else if (k === "B") {
        S.paid = S.paid.slice(0, -1)
      } else if (S.paid.length < 7) {
        S.paid += k
      }

      S.error = "";
      render()
    }

    function quick(v) {
      S.paid = String(v === "x" ? total() : v);
      S.error = "";
      render()
    }

    function payCash() {
      const v = S.paid === "" ? NaN : Number(S.paid);

      if (isNaN(v) || v < 0) {
        S.error = "Invalid amount. Enter the amount you are paying.";
        return render()
      }

      if (v < total()) {
        S.error = "Insufficient payment. Please enter at least " +
          peso(total()) +
          ". You are short by " +
          peso(total() - v) +
          ".";

        return render()
      }

      complete("Cash", v)
    }

    function cardPay() {
      const b = document.getElementById("pb");
      document.getElementById("proc").hidden = false;
      b.disabled = true;

      requestAnimationFrame(() =>
        document.querySelector(".bar i").style.width = "100%"
      );

      setTimeout(() => complete("Credit/Debit Card", total()), 1700)
    }

    const STEP = {
      order: 1,
      review: 2,
      method: 3,
      cash: 3,
      qr: 3,
      card: 3,
      success: 4,
      receipt: 4
    };

    function stepper() {
      const n = STEP[S.screen];
      const l = ["Order", "Review", "Payment", "Receipt"];

      document.getElementById("steps").innerHTML = l.map((t, i) =>
        `<span class="${i + 1 === n ? "on" : i + 1 < n ? "done" : ""}">${i + 1 < n ? "✓ " : i + 1 + " "}${t}</span>`
      ).join("")
    }

    function cartHTML() {
      const it = items();

      if (!it.length) {
        return `
          <div class="empty">
            <div class="big">🛒</div>
            <b>Your order is empty</b><br>
            Tap a product to add it to your order.
          </div>
        `
      }

      return it.map(i => `
        <div class="line">
          <div class="row">
            <div>
              <b>${i.name}</b><br>
              <small style="color:var(--mute)">${peso(i.price)} each</small>
            </div>
            <button
              class="del"
              aria-label="Remove ${i.name}"
              onclick="rem(${i.id})"
            >🗑</button>
          </div>

          <div class="row">
            <div class="q">
              <button
                aria-label="Decrease ${i.name}"
                onclick="chg(${i.id},-1)"
              >−</button>

              <b style="min-width:28px;text-align:center">${i.qty}</b>

              <button
                aria-label="Increase ${i.name}"
                onclick="chg(${i.id},1)"
                style="background:var(--ink);color:var(--card)"
              >+</button>
            </div>

            <b>${peso(i.sub)}</b>
          </div>
        </div>
      `).join("")
    }

    const sumTable = () => `
      <table>
        <tr>
          <th>Product</th>
          <th>Quantity</th>
          <th>Unit price</th>
          <th>Subtotal</th>
        </tr>

        ${items().map(i => `
          <tr>
            <td><b>${i.name}</b></td>
            <td>${i.qty}</td>
            <td>${peso(i.price)}</td>
            <td><b>${peso(i.sub)}</b></td>
          </tr>
        `).join("")}

        <tr>
          <td colspan="3">
            <b>Total Amount</b> (${count()} items)
          </td>
          <td class="total" style="color:var(--acc)">
            ${peso(total())}
          </td>
        </tr>
      </table>
    `;

    const dueBox = l => `
      <div class="panel row">
        <span style="color:var(--mute)">${l}</span>
        <span class="total" style="color:var(--acc)">
          ${peso(total())}
        </span>
      </div>
    `;

    const V = {
      order: () => `
        <div class="layout">
          <section>
            <div class="row toprow">
              <h1>Tap a product to add it</h1>
              <div class="chips">${["All","Drinks","Food","Snacks"].map(c => `<button class="${(S.cat || "All") === c ? "on" : ""}" onclick="setCat('${c}')">${c}</button>`).join("")}</div>
            </div>

            <div class="grid">
              ${PRODUCTS.filter(p => !S.cat || S.cat === "All" || p.cat === S.cat).map(p => `
                <button
                  class="item ${S.cart[p.id] ? "sel" : ""}"
                  onclick="add(${p.id})"
                >
                  ${S.cart[p.id] ? `<span class="badge">${S.cart[p.id]}</span>` : ""}

                  <div
                    class="ico"
                    style="background:${p.bg}"
                  ><img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.replaceWith(document.createTextNode('${p.icon}'))"></div>

                  <b>
                    ${p.name}
                    <em>${peso(p.price)}</em>
                  </b>
                </button>
              `).join("")}
            </div>
          </section>

          <aside
            class="panel"
            style="align-self:start;position:sticky;top:12px"
          >
            <div class="row">
              <h2 style="margin:0">Your Order</h2>
              <span style="color:var(--mute)">${count()} items</span>
            </div>

            <br>

            ${cartHTML()}

            <div class="row" style="margin:12px 0">
              <b>Total</b>
              <span class="total">${peso(total())}</span>
            </div>

            <button
              class="p"
              style="width:100%"
              ${total() ? "" : "disabled"}
              onclick="go('review')"
            >
              Proceed to Payment →
            </button>
          </aside>
        </div>
      `,

      review: () => `
        <h1>Review your order</h1>

        <p class="sub">
          Check your items before paying. Tap Back to make changes — your items stay in the cart.
        </p>

        <div class="panel">
          ${sumTable()}
        </div>

        <div class="row" style="margin-top:16px;gap:16px">
          <button
            style="flex:1"
            onclick="go('order')"
          >
            ← Back
          </button>

          <button
            class="p"
            style="flex:2"
            onclick="go('method')"
          >
            Continue to Payment →
          </button>
        </div>
      `,

      method: () => `
        <div class="row" style="align-items:flex-start;flex-wrap:wrap">
          <div>
            <h1>How would you like to pay?</h1>
            <p class="sub">Tap one of the options below.</p>
          </div>

          ${dueBox("Amount due")}
        </div>

        <div class="pay">
          <button onclick="S.paid='';go('cash')">
            <span class="big">💵</span>
            Cash
            <small>
              Enter the amount you are paying. Change is computed for you.
            </small>
          </button>

          <button onclick="go('qr')">
            <span class="big">▦</span>
            QR Payment
            <small>
              Scan with a supported e-wallet or banking app.
            </small>
          </button>

          <button onclick="go('card')">
            <span class="big">💳</span>
            Credit / Debit Card
            <small>
              Tap, insert, or swipe your card at the reader.
            </small>
          </button>
        </div>

        <br>

        <button onclick="go('review')">
          ← Back to Order
        </button>
      `,

      cash: () => {
        const v = S.paid === "" ? null : Number(S.paid);
        const ok = v !== null && v >= total();

        return `
          <div class="two">
            <section>
              <h1 class="ttl"><span class="ticon">💵</span> Cash Payment</h1>

              ${dueBox("Total amount")}

              <p class="lbl">
                Amount paid
              </p>

              <div class="amt ${S.error ? "bad" : ""}">
                ${
                  v === null
                    ? '<span style="color:var(--mute)">₱0.00</span>'
                    : peso(v)
                }
              </div>

              ${
                S.error
                  ? `
                    <div class="msg err" role="alert" style="display:flex;gap:12px;align-items:center"><span class="eic">!</span><span>
                      <b>${S.error.split(". ")[0]}.</b><br>
                      ${S.error.split(". ").slice(1).join(". ")}</span>
                    </div>
                  `
                  : ""
              }

              <p class="lbl">Quick amounts</p>
              <div class="quick">
                <button class="${v === total() ? 'on' : ''}" onclick="quick('x')">
                  Exact
                </button>

                ${[200, 500, 1000].map(n => `
                  <button class="${v === n ? 'on' : ''}" onclick="quick(${n})">
                    ₱${n.toLocaleString()}
                  </button>
                `).join("")}
              </div>

              <div
                class="msg ${ok ? "ok" : ""}"
                style="${ok ? "" : "background:var(--card);border:1px solid var(--line)"}"
              >
                <div class="row">
                  <div><b>Change</b>${ok ? `<br><small>${peso(v)} − ${peso(total())}</small>` : ""}</div>
                  <span class="total">
                    ${ok ? peso(v - total()) : "—"}
                  </span>
                </div>
              </div>
            </section>

            <section>
              <div class="keys">
                ${[1,2,3,4,5,6,7,8,9].map(n => `
                  <button onclick="key('${n}')">${n}</button>
                `).join("")}

                <button onclick="key('C')">
                  Clear
                </button>

                <button onclick="key('0')">
                  0
                </button>

                <button
                  aria-label="Backspace"
                  onclick="key('B')"
                >
                  ⌫
                </button>
              </div>

              <br>

              <button
                class="p"
                style="width:100%"
                onclick="payCash()"
              >
                Pay Now
              </button>

              <br><br>

              <button
                style="width:100%"
                onclick="go('method')"
              >
                ← Change payment method
              </button>
            </section>
          </div>
        `
      },

      qr: () => `
        <div class="two">
          <div class="panel">
            <div class="qr" id="qrbox">QR CODE<br>placeholder</div>

            <p style="text-align:center;color:var(--mute)">
              Ref: QR-${"TXN-" + new Date().getFullYear() + "-" + String(seq + 1).padStart(5, "0")}
            </p>
          </div>

          <section>
            <h1>▦ QR Payment</h1>

            ${dueBox("Amount to pay")}

            <ol style="font-size:20px;line-height:1.7">
              <li>
                Scan the QR code using your supported payment application.
              </li>
              <li>
                Check that the amount is ${peso(total())} and approve it in your app.
              </li>
              <li>
                Tap Confirm Payment below.
              </li>
            </ol>

            <div class="row" style="gap:12px">
              <button
                style="flex:1"
                onclick="go('method')"
              >
                ← Back
              </button>

              <button
                class="p"
                style="flex:2"
                onclick="complete('QR Payment',total())"
              >
                ✓ Confirm Payment
              </button>
            </div>

            <p class="sub">
              Simulated payment — the amount paid equals the total, with ₱0.00 change.
            </p>
          </section>
        </div>
      `,

      card: () => `
        <div class="two">
          <div
            class="panel center"
            style="width:100%"
          >
            <div
              class="big"
              style="font-size:90px"
            >
              💳
            </div>

            <b>Tap, insert, or swipe</b>
          </div>

          <section>
            <h1>💳 Credit / Debit Card</h1>

            ${dueBox("Amount due")}

            <h3>
              Please tap, insert, or swipe your card.
            </h3>

            <div
              id="proc"
              class="msg"
              style="background:#ede9fe;color:#4c1d95"
              hidden
            >
              <b>Processing payment…</b>

              <div class="bar">
                <i></i>
              </div>

              Do not remove your card until the payment is complete.
            </div>

            <div class="row" style="gap:12px">
              <button
                style="flex:1"
                onclick="go('method')"
              >
                ← Back
              </button>

              <button
                id="pb"
                class="p"
                style="flex:2"
                onclick="cardPay()"
              >
                Process Payment
              </button>
            </div>
          </section>
        </div>
      `,

      success: () => {
        const t = S.txn;

        return `
          <div class="center">
            <div class="check">✓</div>

            <h1 style="color:var(--ok)">
              Payment Successful
            </h1>

            <p class="sub">
              Transaction completed successfully. Thank you!
            </p>

            <div class="panel">
              ${
                [
                  ["Transaction No.", t.no],
                  ["Payment method", t.method],
                  ["Transaction amount", peso(t.total)],
                  ["Amount paid", peso(t.paid)],
                  ["Change", peso(t.change)]
                ].map(r => `
                  <div
                    class="row"
                    style="padding:9px 0;border-bottom:1px solid var(--line)"
                  >
                    <span style="color:var(--mute)">
                      ${r[0]}
                    </span>
                    <b>${r[1]}</b>
                  </div>
                `).join("")
              }
            </div>

            <br>

            <button
              class="p"
              style="width:100%"
              onclick="go('receipt')"
            >
              🧾 View Receipt
            </button>
          </div>
        `
      },

      receipt: () => {
        const t = S.txn;

        return `
          <div
            class="two"
            style="align-items:center"
          >
            <div class="receipt">
              <div style="text-align:center">
                <b style="font-size:20px">
                  CAMPUS STORE POS
                </b>
                <br>
                <small>
                  Self-Service Kiosk · Official Digital Receipt
                </small>
              </div>

              <hr>

              <div class="row">
                <span>Transaction No.</span>
                <b>${t.no}</b>
              </div>

              <div class="row">
                <span>Date</span>
                <span>
                  ${t.date.toLocaleString("en-PH", {
                    dateStyle: "long",
                    timeStyle: "short"
                  })}
                </span>
              </div>

              <hr>

              ${
                t.items.map(i => `
                  <div class="row">
                    <b>${i.name}</b>
                    <b>${peso(i.sub)}</b>
                  </div>

                  <div>
                    ${i.qty} × ${peso(i.price)}
                  </div>
                `).join("")
              }

              <hr>

              <div
                class="row"
                style="font-size:20px"
              >
                <b>TOTAL</b>
                <b>${peso(t.total)}</b>
              </div>

              <div class="row">
                <span>Payment method</span>
                <span>${t.method}</span>
              </div>

              <div class="row">
                <span>Amount paid</span>
                <span>${peso(t.paid)}</span>
              </div>

              <div class="row">
                <span>Change</span>
                <span>${peso(t.change)}</span>
              </div>

              <div class="row">
                <span>Status</span>
                <b style="color:#15803d">
                  Payment Successful
                </b>
              </div>

              <hr>

              <div style="text-align:center">
                Thank you for your purchase!
              </div>
            </div>

            <section class="noprint">
              <h1>Your receipt</h1>

              <p class="sub">
                Keep this for your records. Tap New Transaction when you are done — your order and payment details will be cleared.
              </p>

              <button
                class="p"
                style="width:100%"
                onclick="newTxn()"
              >
                + New Transaction
              </button>

              <br><br>

              <button
                style="width:100%"
                onclick="window.print()"
              >
                🖨 Print Receipt
              </button>

              <p class="sub">
                Printing is optional — the digital receipt is your proof of payment.
              </p>
            </section>
          </div>
        `
      }
    };

    function render() {
      stepper();
      const appEl = document.getElementById("app");
      appEl.innerHTML = V[S.screen]();
      if (render.last !== S.screen) {
        appEl.classList.remove("enter"); void appEl.offsetWidth; appEl.classList.add("enter");
        window.scrollTo(0, 0); render.last = S.screen
      }
      if (S.screen === "qr") drawQR()
    }

    // Builds a real, scannable QR code. The payload is simulated (not a bank/e-wallet format).
    function drawQR() {
      const box = document.getElementById("qrbox");
      if (!box || typeof QRCode === "undefined") return; // offline: keep the placeholder
      const ref = "QR-TXN-" + new Date().getFullYear() + "-" + String(seq + 1).padStart(5, "0");
      const payload = "CAMPUSSTORE|" + ref + "|PHP " + total().toFixed(2);
      box.textContent = "";
      new QRCode(box, { text: payload, width: 220, height: 220, colorDark: "#111827", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M })
    }

    render();
  </script>
</body>
</html>
